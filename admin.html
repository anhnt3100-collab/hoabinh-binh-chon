<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Quản lý bình chọn Hòa Bình</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#EDF3EF;--surface:#fff;--ink:#14302A;--muted:#55706A;--line:#D3E0D9;--a:#3E7A2C;--b:#13698A;--sun:#E5902A;--bad:#C2372B;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0F1A18;--surface:#172522;--ink:#E4EEE9;--muted:#9DB3AC;--line:#2A3C37;--a:#94C764;--b:#5CB9DD;--sun:#F0A445;--bad:#F08A80;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,sans-serif;line-height:1.5}
.wrap{max-width:820px;margin:0 auto;padding:32px max(16px,env(safe-area-inset-left))}
h1{font-size:1.8rem;margin:0 0 4px}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;margin-top:18px}
input{border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit;min-width:0;flex:1}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:9px 14px;font-weight:600}
button.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button.danger{color:var(--bad);border-color:var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stats{display:flex;gap:28px;flex-wrap:wrap}
.stats b{display:block;font-size:2.4rem;line-height:1}
.sa b{color:var(--a)}.sb b{color:var(--b)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:480px;font-size:.95rem}
th,td{text-align:left;padding:10px 8px;border-top:1px solid var(--line)}
th{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);border-top:0}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-weight:700;color:var(--surface)}
.pA{background:var(--a)}.pB{background:var(--b)}
#msg{min-height:1.4em;margin-top:8px}
.warn{color:var(--bad)}
textarea{width:100%;min-height:120px;margin-top:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:10px;font:inherit}
</style>
</head>
<body>
<div class="wrap">
  <h1>Quản lý bình chọn</h1>
  <p class="muted">Hòa Bình 21–22/11 · hạn hết ngày 10/11. <a href="/">Mở trang bình chọn</a></p>

  <div class="card" id="login">
    <form class="row" id="loginForm">
      <input id="key" type="password" placeholder="Mã quản trị (ADMIN_KEY)" autocomplete="current-password">
      <button class="primary" type="submit">Vào quản lý</button>
    </form>
    <div id="msg" role="status"></div>
  </div>

  <div id="panel" hidden>
    <div class="card">
      <div class="stats"><div class="sa"><b id="ca">0</b>Phương án A</div><div class="sb"><b id="cb">0</b>Phương án B</div><div><b id="ct">0</b>Tổng phiếu</div></div>
      <p class="muted" id="state"></p>
    </div>
    <div class="card">
      <div class="row" style="justify-content:space-between"><strong>Danh sách phiếu</strong><span class="muted">Tự làm mới mỗi 5 giây</span></div>
      <div class="tw"><table><thead><tr><th>Tên</th><th>Chọn</th><th>Lúc bỏ/đổi phiếu</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
    </div>
    <div class="card">
      <div class="row">
        <button id="copySum" type="button">Sao chép kết quả</button>
        <button id="wipe" class="danger" type="button">Xoá toàn bộ phiếu</button>
      </div>
      <div class="row" id="wipeConfirm" hidden style="margin-top:10px">
        <span class="warn">Xoá hết phiếu? Không khôi phục được.</span>
        <button id="wipeYes" class="danger" type="button">Xoá hết</button>
        <button id="wipeNo" type="button">Huỷ</button>
      </div>
      <textarea id="sumArea" readonly hidden></textarea>
    </div>
  </div>
</div>
<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
let KEY="", votes=[];
try{ KEY=sessionStorage.getItem("hb-admin")||""; }catch(e){}
const fmt=t=>new Date(t).toLocaleString("vi-VN",{timeZone:"Asia/Ho_Chi_Minh",hour:"2-digit",minute:"2-digit",day:"2-digit",month:"2-digit"});
async function api(method, q){
  const r=await fetch("/api/votes"+(q||""),{method,headers:{"x-admin-key":KEY},cache:"no-store"});
  const j=await r.json().catch(()=>({})); if(!r.ok) throw new Error(j.error||("Lỗi "+r.status)); return j;
}
function render(j){
  votes=j.votes||[];
  const a=votes.filter(v=>v.choice==="A").length, b=votes.filter(v=>v.choice==="B").length;
  $("ca").textContent=a; $("cb").textContent=b; $("ct").textContent=votes.length;
  $("state").textContent=j.closed? "Đã hết hạn, bình chọn đã khoá." : "Đang mở bình chọn.";
  const tb=$("rows"); tb.textContent="";
  if(!votes.length){ const tr=document.createElement("tr"); const td=document.createElement("td"); td.colSpan=4; td.className="muted"; td.textContent="Chưa có phiếu nào."; tr.appendChild(td); tb.appendChild(tr); return; }
  votes.forEach(v=>{
    const tr=document.createElement("tr");
    const n=document.createElement("td"); n.textContent=v.name;
    const c=document.createElement("td"); const p=document.createElement("span"); p.className="pill p"+v.choice; p.textContent=v.choice; c.appendChild(p);
    const t=document.createElement("td"); t.textContent=fmt(v.updatedAt||v.at);
    const d=document.createElement("td"); const btn=document.createElement("button"); btn.className="danger"; btn.type="button"; btn.textContent="Xoá";
    btn.addEventListener("click",async()=>{
      if(btn.dataset.sure!=="1"){ btn.dataset.sure="1"; btn.textContent="Bấm lần nữa để xoá"; setTimeout(()=>{btn.dataset.sure="";btn.textContent="Xoá";},3000); return; }
      try{ render(await api("DELETE","?id="+encodeURIComponent(v.id))); }catch(e){ alertMsg(e.message); }
    });
    d.appendChild(btn);
    tr.append(n,c,t,d); tb.appendChild(tr);
  });
}
function alertMsg(t){ $("msg").textContent=t; $("msg").className="warn"; }
async function refresh(){ try{ const j=await api("GET"); if(j.admin) render(j); }catch(e){} }
async function login(){
  try{
    const j=await api("GET");
    if(!j.admin){ alertMsg("Sai mã quản trị, hoặc chưa đặt biến ADMIN_KEY trên Netlify."); return; }
    try{ sessionStorage.setItem("hb-admin",KEY); }catch(e){}
    $("login").hidden=true; $("panel").hidden=false; render(j);
    setInterval(()=>{ if(!document.hidden) refresh(); },5000);
  }catch(e){ alertMsg(e.message); }
}
$("loginForm").addEventListener("submit",e=>{ e.preventDefault(); KEY=$("key").value.trim(); if(KEY) login(); });
if(KEY) login();
$("copySum").addEventListener("click",async()=>{
  const la=votes.filter(v=>v.choice==="A").map(v=>v.name), lb=votes.filter(v=>v.choice==="B").map(v=>v.name);
  const s="Kết quả bình chọn Hòa Bình 21–22/11\nA – Bản làng & khám phá ("+la.length+"): "+la.join(", ")+"\nB – Ven hồ & tắm khoáng ("+lb.length+"): "+lb.join(", ");
  const ta=$("sumArea"); ta.value=s; ta.hidden=false;
  try{ await navigator.clipboard.writeText(s); $("copySum").textContent="Đã sao chép"; }catch(e){ ta.select(); }
});
$("wipe").addEventListener("click",()=>{ $("wipeConfirm").hidden=false; });
$("wipeNo").addEventListener("click",()=>{ $("wipeConfirm").hidden=true; });
$("wipeYes").addEventListener("click",async()=>{ try{ render(await api("DELETE","?id=*")); }catch(e){ alertMsg(e.message); } $("wipeConfirm").hidden=true; });
})();
</script>
</body>
</html>
